:root{--ink:#1f2430;--paper:#f6f3ee;--light:#fa873c;--shadow:#25507f;--muted:#3f4757;--line:#d9d4ca;--a:#e3e3e0;--i:#ece2d0}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"BIZUDP","BIZ UDPGothic","Hiragino Sans","Noto Sans CJK JP",sans-serif;font-size:17px;line-height:1.7;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:16px 16px 24px}
.kicker{font-size:14px;font-weight:700;color:var(--light);margin:4px 0 0}
h1{font-size:25px;line-height:1.35;margin:4px 0 6px}.sub{color:var(--muted);font-size:16px;margin:0 0 10px}
.card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin:12px 0}
.q{font-size:17px;line-height:1.75}.q b{font-weight:700}
ol{margin:0;padding-left:1.4em}ol li{margin:4px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:17px;font-size:20px;font-weight:700;margin:12px 0 16px;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;position:relative;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(5px)}
.b1{box-shadow:0 6px 0 #c4621f,0 9px 14px rgba(0,0,0,.18);background:linear-gradient(#ffa165,#fa873c)!important}.b1:active{box-shadow:0 1px 0 #c4621f,0 3px 6px rgba(0,0,0,.18)}
.b2{box-shadow:0 6px 0 #16335a,0 9px 14px rgba(0,0,0,.2);background:linear-gradient(#35689f,#25507f)!important}.b2:active{box-shadow:0 1px 0 #16335a,0 3px 6px rgba(0,0,0,.2)}
.b4{box-shadow:0 6px 0 #16335a,0 9px 14px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35);background:linear-gradient(#4a78b0,#25507f)!important;padding-right:44px;padding-left:44px}.b4:active{box-shadow:0 1px 0 #16335a,inset 0 2px 0 rgba(255,255,255,.35)}
.b4::after{content:"›";position:absolute;right:20px;top:50%;transform:translateY(-54%);font-size:30px;font-weight:700}
.b4:disabled::after{opacity:.6}
.b4.sm{font-size:17px;padding-left:16px;padding-right:38px;white-space:nowrap}
.b3{box-shadow:0 5px 0 #c9c3b7,0 8px 12px rgba(0,0,0,.1)}.b3:active{box-shadow:0 1px 0 #c9c3b7}
.btn:disabled{background:#cfcac1!important;color:#fff;box-shadow:0 6px 0 #b5afa4;cursor:default;transform:none}
.btn.big{font-size:24px;padding:22px}
.tori .hint{font-size:14px;color:var(--muted);margin:0 0 6px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-top:1px solid #eee;cursor:pointer}.ck:first-of-type{border-top:0}
.ck input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border:2.5px solid #b5afa4;border-radius:7px;margin:2px 0 0;background:#fff;display:grid;place-content:center}
.ck input:checked{background:var(--light);border-color:var(--light)}.ck input:checked::after{content:"✓";color:#fff;font-weight:700;font-size:17px;line-height:1}
.ck .no{flex:none;font-weight:700;width:1em;text-align:right;margin-top:2px}.ck .tx{flex:1}
.ck input:checked~.tx{color:var(--muted)}
.b1{background:var(--light);color:#fff}.b2{background:var(--shadow);color:#fff}.b3{background:#fff;color:var(--ink);border:2px solid var(--line)}.b4{background:var(--ink);color:#fff}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:-2px}.duo{display:flex;gap:2px;flex:none}.duo img{height:84px}
.flow{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted);margin:4px 0 8px}.flow span{white-space:nowrap;padding:3px 9px;border-radius:999px;background:#e9e5de}.flow .on{background:var(--ink);color:#fff}.flow .ar{background:none;padding:0}
.tori .lbl{display:inline-block;margin:0 0 6px;padding:1px 12px;border-radius:6px;background:var(--light);color:#fff;font-weight:700;font-size:15px}
/* 道のり（常に上に出す） */
.hd{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;margin-bottom:6px}
.hd .me{padding:4px 12px;border-radius:999px;color:#fff}.hd .tot{color:var(--ink)}
.jr{background:#fff;border-radius:14px;padding:10px 8px 8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.jr .yr{display:grid;grid-template-columns:48px repeat(4,1fr) 40px;gap:3px;margin-bottom:4px}.jr .yr span{white-space:nowrap;letter-spacing:-.02em;font-size:10px;line-height:1.2;text-align:center;color:var(--shadow);font-weight:700}
.jr .row{display:grid;grid-template-columns:48px repeat(4,1fr) 40px;gap:3px;align-items:start}
.jr .end{font-size:11px;font-weight:700;color:var(--muted);text-align:center;line-height:1.25;padding-top:14px}
.jr .end img{width:38px;display:block;margin:0 auto 2px}
.st{position:relative;text-align:center;font-size:11px;line-height:1.3;color:var(--muted);padding-top:18px}
.st::before{content:"";position:absolute;left:-4px;right:-4px;top:7px;height:4px;background:var(--line);border-radius:2px}
.st::after{content:"";position:absolute;left:50%;top:1px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--line);box-sizing:border-box}
.st.done::before{background:var(--light)}.st.done::after{background:var(--light);border-color:var(--light)}
.st.now::after{border-color:var(--light);background:#fff4ec;width:20px;height:20px;margin-left:-10px;top:-1px}
.st b{display:block;font-size:12px;color:var(--ink)}
.st .nm{display:block;white-space:nowrap}
.st .now-t{display:inline-block;margin-top:2px;padding:0 5px;border-radius:6px;background:var(--light);color:#fff;font-size:10px;font-weight:700}

 const m=document.getElementById('msg');m.className='msg ok';m.textContent=`クリア（${S.tries[S.stage]}回目）`;
 st.ev.forEach((e,k)=>{const p=document.getElementById('pin'+k);p.classList.remove('tray');p.style.left=(pl[k]!==undefined?pl[k]:pos(e.k,r))+'%';
  setTimeout(()=>{p.style.left=pos(e.k,r)+'%'},300);
  ru.insertAdjacentHTML('beforeend',`<div class="pin co2" id="cp${k}" style="background:${COL[k]};left:${pos(e.k,r)}%">${e.n}</div>`);
  document.getElementById('res'+k).innerHTML=`<b>${unit(e)}</b>　CO2 <b>${fmtC(e.c)}</b>（${e.co2}）<br><span style="color:var(--muted)">${e.note}</span>`});
 setTimeout(()=>{const on=st.ev.map((e,k)=>k).sort((a,b)=>st.ev[a].k-st.ev[b].k);let pu=false;on.forEach((k,i)=>{const p=document.getElementById('pin'+k);p.classList.remove('up');if(i&&pos(st.ev[k].k,r)-pos(st.ev[on[i-1]].k,r)<7&&!pu){p.classList.add('up');document.getElementById('cp'+k).classList.add('dn');pu=true}else pu=false})},320)}

// 共通：IT1-1 の作りに合わせた部品（保存・戻る・やり直し・吹き出し・おわりの花火）
const app=document.getElementById('app');
let HIST=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:BUILD,t:Date.now(),S,H:HIST.slice(-60)}))}catch(e){}}
function go(x){S.step=x;save();render();window.scrollTo(0,0)}
try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k!==KEY&&k.startsWith(KEYP))localStorage.removeItem(k)}
 const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.v===BUILD&&Date.now()-o.t<3*3600*1000&&o.S&&o.S.step){Object.assign(S,o.S);HIST=o.H||[]}}catch(e){}
document.addEventListener('click',e=>{const b=e.target.closest('.btn');if(b&&!b.disabled)HIST.push(JSON.stringify(S))},true);
function back(){if(!HIST.length)return;const o=JSON.parse(HIST.pop());for(const k in S)delete S[k];Object.assign(S,o);save();render();window.scrollTo(0,0)}
function restart(){if(!confirm('最初からやり直しますか。ここまでの記録は消えます。'))return;try{localStorage.removeItem(KEY)}catch(e){};location.reload()}
const fig=(w,f,t)=>{ if(!/[。！？」]$/.test(t)) t+='。'; return `<div class="fig ${w}"><img src="${FG[f]}" alt=""><p>${t}</p></div>`; };
function tick(){const b=[...document.querySelectorAll('.ck input')];const n=b.filter(x=>x.checked).length;const g=document.getElementById('go');g.disabled=n<b.length;document.getElementById('left').textContent=n<b.length?'あと '+(b.length-n)+' 項目':'すべて読んだ'}
const tori=(items,btn,next)=>`<div class="card q tori"><p class="lbl">取扱説明書</p><p class="hint">読んだ項目にチェックを入れる</p>${items.map((t,k)=>`<label class="ck"><input type="checkbox" onchange="tick()"><span class="no">${k+1}</span><span class="tx">${t}</span></label>`).join('')}</div>
 <button id="go" class="btn b4" disabled onclick="${next}">${btn}</button><p class="nth" id="left">あと ${items.length} 項目</p>`;
const flow=(names,on)=>`<div class="flow">${names.map((n,k)=>`${k?'<span class="ar">→</span>':''}<span class="${k===on?'on':''}">${n}</span>`).join('')}</div>`;
function fireworks(){const j=document.getElementById('endmark');if(j){j.classList.remove('jumping');void j.offsetWidth;j.classList.add('jumping')}
 const c=document.createElement('canvas');c.className='fw';document.body.appendChild(c);const x=c.getContext('2d');
 c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
 const w=innerWidth,h=innerHeight,cols=['#fa873c','#e0a800','#25507f','#3d7ab8','#e0457b'];const P=[];const R=[];let t=0;
 const launch=()=>R.push({x:w*(.2+.6*Math.random()),y:h,vy:-(h*.013+Math.random()*h*.004),ty:h*(.18+.25*Math.random()),c:cols[Math.random()*cols.length|0]});
 for(let i=0;i<6;i++)setTimeout(launch,i*380);
 (function f(){t++;x.clearRect(0,0,w,h);
  for(let i=R.length-1;i>=0;i--){const r=R[i];r.y+=r.vy;x.fillStyle=r.c;x.fillRect(r.x-1.5,r.y,3,8);
   if(r.y<=r.ty){for(let k=0;k<46;k++){const a=Math.PI*2*k/46,v=2+Math.random()*2.6;P.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60+Math.random()*25,c:Math.random()<.75?r.c:'#f2c14e'})}R.splice(i,1)}}
  for(let i=P.length-1;i>=0;i--){const q=P[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.97;q.vy=q.vy*.97+.05;q.l--;x.globalAlpha=Math.max(0,q.l/80);x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,3,0,7);x.fill();x.globalAlpha=1;if(q.l<=0)P.splice(i,1)}
  if(t<60*5||P.length||R.length)requestAnimationFrame(f);else c.remove()})()}
function watchEnd(){const e=document.getElementById('endmark');if(!e||!('IntersectionObserver' in window))return;const o=new IntersectionObserver(es=>{if(es[0].isIntersecting){fireworks();o.disconnect()}},{threshold:.6});o.observe(e)}
const endMark=(a,i)=>`<div class="end-mark" id="endmark" onclick="fireworks()"><div class="jumpers"><img class="j1" src="${FG[a]}" alt=""><img class="j2" src="${FG[i]}" alt=""></div><p>おわり</p></div>`;
function render(){view();
 if(S.step!=='welcome'&&S.step!=='cover'&&HIST.length)app.insertAdjacentHTML('afterbegin','<button class="back" onclick="back()">‹ 一つ前に戻る</button>');
 if(S.step!==LAST&&S.step!=='cover')app.insertAdjacentHTML('beforeend','<button class="reset" onclick="restart()">最初からやり直す</button>');
 if(S.step===LAST)setTimeout(watchEnd,300);
 if(typeof after==='function')after()}

// ウェルカムページ：二人を大きめに置き、趣旨を説明して鼓舞する
const WELCOME='ようこそ、ワークの案内役は、<br>僕たち・わたしたち、だよ！（エイ＆アイ）';
const welcome=(kicker,title,sub,lines,btn,next,a,i)=>`<p class="kicker">${kicker}</p><h1>${title}</h1><p class="sub" style="font-weight:700;color:var(--ink)">${WELCOME}</p>
 <div class="hero"><img src="${FG[a]}" alt=""><img src="${FG[i]}" alt=""></div>
 ${lines.map(l=>fig(l[0],l[1],l[2]).replace('class="fig ','class="fig lg ')).join('')}
 <button class="btn big b1" onclick="${next}">${btn}</button>`;

// 表紙：題、大写しのキャラクター、小さなAI使用クレジット
const COVERCREDIT='生成AI使用：キャラクターの作画 Gemini 3.1 Flash Image（Nano Banana 2、Google）／加工・ページ制作 Claude Opus 5.5（Anthropic）／監修 工藤聡一';
const cover=(kicker,title,sub,figs,btn,next)=>`<div class="cover"><p class="ck2">${kicker}</p><h1 class="ct">${title}</h1>${sub?`<p class="cs">${sub}</p>`:''}<div class="cfig">${figs.map(f=>`<img src="${FG[f]}" alt="" style="flex:${FA[f]||1} 1 0">`).join('')}</div><button class="btn b1 cgo" onclick="${next}">${btn}</button><p class="ccr">${COVERCREDIT}</p></div>`;

render();
</script></body></html>
